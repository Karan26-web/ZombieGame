<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no,
                 viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Zombie Hop</title>
  <script src="js/phaser.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #03040b;
      overflow: hidden;
      touch-action: none;       /* prevent scroll / zoom on mobile */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #game-container {
      width: 100%; height: 100%;
    }

    /* Phaser injects the canvas inside #game-container.
       Scale Manager + autoCenter handle sizing – we just
       ensure the canvas is block-level and centred. */
    canvas {
      display: block;
      outline: none;
      image-rendering: pixelated;
    }

    /* ── Portrait-mode nudge (phones held upright) ─────────────────────── */
    #rotate-msg {
      display: none;
      position: fixed; inset: 0;
      background: #03040b;
      color: #f0c040;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
    }
    #rotate-msg svg { width: 56px; height: 56px; fill: #f0c040; opacity: .8; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-aspect-ratio: 1/1) {
      /* portrait: game container hidden, warning shown */
      #game-container { display: none; }
      #rotate-msg     { display: flex; }
    }
  </style>
</head>
<body>

  <!-- Portrait orientation warning -->
  <div id="rotate-msg">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97
               8.48h1.55C23.64 4.99 19.29.45 13.68.01L16.48
               2.52zm-6.25-.77c-1.17.36-2.28.97-3.2
               1.78L8.46 4.96c.74-.61 1.6-1.08 2.54-1.36L10.23
               1.75zM1.55 13c.36 3.68 2.72 6.81 5.98
               8.34l2.8-2.5c-.93-.28-1.8-.76-2.54-1.36L6.37
               18.9C4.51 17.32 3.27 15.08 3 12.58L1.55
               13zm14.92 9.48C19.29 23.55 23.64 19.01
               24 13h-1.55c-.36 3.76-2.7 6.93-5.97
               8.48l2.8 2.52-.81.48zM12 10a2 2 0
               100 4 2 2 0 000-4zm0-8C6.48 2 2 6.48 2
               12s4.48 10 10 10 10-4.48 10-10S17.52
               2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8
               8-8 8 3.59 8 8-3.59 8-8 8z"/>
    </svg>
    <p>Rotate your device<br>to landscape to play ☠</p>
  </div>

  <div id="game-container"></div>
  <div id="diag" style="display:none;position:fixed;bottom:4px;right:6px;color:#6f6;font:11px monospace;z-index:9999;pointer-events:none;background:rgba(0,0,0,.5);padding:2px 4px;">JS ok</div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.getElementById('err-overlay');
      if (!d) { d = document.createElement('div'); d.id='err-overlay';
        d.style.cssText='position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:14px monospace;padding:10px;z-index:9999;white-space:pre-wrap;'; document.body.appendChild(d); }
      d.textContent += (src||'')+'@'+line+': '+msg+'\n'; };
    window.addEventListener('unhandledrejection', function(e) {
      window.onerror(e.reason, 'promise', 0, 0, e.reason);
    });
  </script>
  <script src="js/game.js?v=20260413j"></script>
  <script>
    var DEBUG_UI = /[?&]debug=1\b/.test(window.location.search);
    var diag = document.getElementById('diag');
    if (DEBUG_UI) diag.style.display = 'block';
    diag.textContent = 'scripts ok';
    window.addEventListener('load', function() {
      var d = document.getElementById('diag');
      var gc = document.getElementById('game-container');

      // Show container size BEFORE Phaser reads it
      var r = gc.getBoundingClientRect();
      if (DEBUG_UI) d.textContent = 'container ' + Math.round(r.width) + 'x' + Math.round(r.height);

      // If height is 0, CSS percentage chain failed — force it
      if (r.height < 10) {
        gc.style.position = 'fixed';
        gc.style.top = '0';
        gc.style.left = '0';
        gc.style.width = '100%';
        gc.style.height = '100%';
        if (DEBUG_UI) d.textContent = 'FIXED ' + window.innerWidth + 'x' + window.innerHeight;
      }

      Promise.resolve(initZombieGame()).catch(function(err) {
        if (DEBUG_UI) d.textContent = 'init-err:' + ((err && err.message) || String(err)).slice(0, 80);
      });

      // Check canvas 2 seconds after Phaser starts (appends, preserves scene diag)
      setTimeout(function() {
        var c = gc.querySelector('canvas');
        if (!DEBUG_UI) return;
        if (!c) { d.textContent += ' | NO CANVAS'; return; }
        d.textContent += ' | cvs:' + c.width + 'x' + c.height;
      }, 2000);
    });
  </script>
</body>
</html>
